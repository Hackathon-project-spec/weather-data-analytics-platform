version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: weather-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - weather-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: weather-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-net

  postgres:
    image: postgres:16-alpine
    container_name: weather-postgres
    environment:
      POSTGRES_DB: weather_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weather-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: weather-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weather-net

  redis:
    image: redis:7-alpine
    container_name: weather-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weather-net

  # Backend Microservices (Profile: services / all)
  ingestion-service:
    build:
      context: ../weather-platform-backend/ingestion-service
      dockerfile: Dockerfile
    container_name: weather-ingestion-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - weather-net
    profiles: ["services", "all"]

  citizen-service:
    build:
      context: ../weather-platform-backend/citizen-service
      dockerfile: Dockerfile
    container_name: weather-citizen-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      VERIFICATION_SERVICE_URL: http://verification-engine:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - weather-net
    profiles: ["services", "all"]

  verification-engine:
    build:
      context: ../weather-platform-backend/verification-engine
      dockerfile: Dockerfile
    container_name: weather-verification-engine
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      INGESTION_SERVICE_URL: http://ingestion-service:8081
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - weather-net
    profiles: ["services", "all"]

  analytics-service:
    build:
      context: ../weather-platform-backend/analytics-service
      dockerfile: Dockerfile
    container_name: weather-analytics-service
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/weather_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - weather-net
    profiles: ["services", "all"]

  api-gateway:
    build:
      context: ../weather-platform-backend/api-gateway
      dockerfile: Dockerfile
    container_name: weather-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INGESTION_SERVICE_URL: http://ingestion-service:8081
      CITIZEN_SERVICE_URL: http://citizen-service:8082
      VERIFICATION_SERVICE_URL: http://verification-engine:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - weather-net
    profiles: ["services", "all"]

networks:
  weather-net:
    driver: bridge
